app = "pantaback-india"
primary_region = "sin"

[build]

[env]
  NODE_ENV = "production"
  DATABASE_PATH = "/data/pintaback.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "pantaback_india_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
