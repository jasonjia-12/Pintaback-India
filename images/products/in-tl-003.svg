<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgStudioLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bgMarble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bgDarkStudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Material Gradients -->
    <linearGradient id="nonStickGranite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="stainlessSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="copperBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="woodGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="dewaltYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="tealPine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d5c75"/>
      <stop offset="100%" stop-color="#093d4e"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Surface Background -->
  <rect width="800" height="600" fill="url(#bgStudioLight)"/>
  <ellipse cx="400" cy="460" rx="360" ry="80" fill="#000000" fill-opacity="0.06" filter="url(#softShadow)"/>

  <!-- Product Graphics Scene -->
  
    <g filter="url(#softShadow)" transform="translate(140, 80)">
      <!-- Open Toolbox Case Body -->
      <rect x="40" y="60" width="440" height="320" rx="24" fill="#0f172a" stroke="url(#dewaltYellow)" stroke-width="6"/>
      <rect x="60" y="80" width="400" height="280" rx="16" fill="#1e293b"/>

      <!-- Molded Tool Slots & Tools -->
      <!-- Claw Hammer -->
      <g transform="translate(80, 100)">
        <rect x="20" y="100" width="180" height="24" rx="12" fill="url(#woodGrip)"/>
        <path d="M 0 90 L 40 70 L 40 140 Z" fill="url(#stainlessSteel)"/>
      </g>
      <!-- Pliers Set -->
      <g transform="translate(280, 110)">
        <path d="M 20 0 L 0 80 M 40 0 L 60 80" fill="none" stroke="#ef4444" stroke-width="20" stroke-linecap="round"/>
        <circle cx="30" cy="15" r="16" fill="url(#stainlessSteel)"/>
      </g>
      <!-- Screwdrivers Grid -->
      <g transform="translate(90, 240)">
        <rect x="0" y="0" width="120" height="20" rx="10" fill="#facc15"/>
        <rect x="0" y="30" width="140" height="20" rx="10" fill="#ef4444"/>
        <rect x="0" y="60" width="110" height="20" rx="10" fill="#0284c7"/>
      </g>
      <!-- Sockets Grid -->
      <g transform="translate(260, 230)">
        
          <circle cx="20" cy="20" r="12" fill="url(#stainlessSteel)"/>
        
          <circle cx="55" cy="20" r="12" fill="url(#stainlessSteel)"/>
        
          <circle cx="90" cy="20" r="12" fill="url(#stainlessSteel)"/>
        
          <circle cx="125" cy="20" r="12" fill="url(#stainlessSteel)"/>
        
          <circle cx="20" cy="55" r="12" fill="url(#stainlessSteel)"/>
        
          <circle cx="55" cy="55" r="12" fill="url(#stainlessSteel)"/>
        
          <circle cx="90" cy="55" r="12" fill="url(#stainlessSteel)"/>
        
          <circle cx="125" cy="55" r="12" fill="url(#stainlessSteel)"/>
        
      </g>
      <!-- Central Carrying Handle -->
      <rect x="200" y="20" width="120" height="40" rx="12" fill="url(#dewaltYellow)"/>
    </g>
  

  <!-- Floating Badge Header -->
  <g transform="translate(30, 30)">
    <rect width="268" height="34" rx="17" fill="url(#tealPine)"/>
    <text x="134" y="22" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1">DIRECT SOURCING FROM CHINA</text>
  </g>

  <!-- Specs Badges Footer Overlay -->
  <g transform="translate(30, 520)">
    <rect width="740" height="50" rx="14" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="20" y="31" fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Home Tool Kit 100 pcs with Toolbox</text>
    <text x="720" y="31" text-anchor="end" fill="#0284c7" font-family="system-ui, sans-serif" font-size="14" font-weight="700">SKU: in-tl-003</text>
  </g>
</svg>