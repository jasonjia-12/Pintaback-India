<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ab7a"/>
      <stop offset="100%" stop-color="#c68a52"/>
    </linearGradient>
    <linearGradient id="skinChinese" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba518"/>
    </linearGradient>
    <linearGradient id="suitDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shirtWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="28" fill="url(#cardOverlay)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Character Scene -->
  
    <g transform="translate(250, 60)" filter="url(#shadow)">
      <!-- China Export Warehouse Backdrop -->
      <rect x="-80" y="20" width="460" height="360" rx="24" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>
      
      <!-- Character: Chen Wei (China Sourcing Operations Manager) -->
      <!-- Shoulders & Smart Corporate Polo / Jacket -->
      <path d="M 10 380 Q 150 250 290 380 Z" fill="#0284c7"/>
      <polygon points="130,270 170,270 150,380" fill="#ffffff"/> <!-- White Collar -->
      <path d="M 50 380 L 130 270 L 150 340 L 70 380 Z" fill="#0369a1"/>
      <path d="M 250 380 L 170 270 L 150 340 L 230 380 Z" fill="#0369a1"/>

      <!-- Neck & Head -->
      <rect x="130" y="220" width="40" height="60" rx="10" fill="url(#skinChinese)"/>
      <ellipse cx="150" cy="180" rx="52" ry="68" fill="url(#skinChinese)"/>

      <!-- Modern Haircut -->
      <path d="M 98 150 C 98 85 202 85 202 150 C 180 100 120 100 98 150 Z" fill="#0f172a"/>

      <!-- Eyes & Smile -->
      <circle cx="132" cy="165" r="4.5" fill="#0f172a"/>
      <circle cx="168" cy="165" r="4.5" fill="#0f172a"/>
      <path d="M 136 195 Q 150 208 164 195" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>

      <!-- Wearing Official China Inspection Badge ID Card -->
      <rect x="132" y="280" width="36" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect x="140" y="290" width="20" height="15" rx="3" fill="#0284c7"/>
      <line x1="150" y1="240" x2="150" y2="280" stroke="#ef4444" stroke-width="3"/> <!-- Lanyard -->

      <!-- Holding Digital Sourcing Tablet / QC Checklist -->
      <g transform="translate(-40, 210)" filter="url(#shadow)">
        <rect x="0" y="0" width="140" height="170" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
        <rect x="15" y="15" width="110" height="100" rx="8" fill="#1e293b"/>
        <circle cx="40" cy="40" r="10" fill="#22c55e"/> <!-- Verified Green Check -->
        <text x="60" y="44" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="800">VERIFIED</text>
        <rect x="25" y="65" width="90" height="6" rx="3" fill="#38bdf8"/>
        <rect x="25" y="80" width="70" height="6" rx="3" fill="#38bdf8"/>
        <rect x="25" y="130" width="90" height="24" rx="12" fill="url(#gold)"/>
        <text x="70" y="146" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="900">QUALITY PASSED</text>
      </g>
    </g>
  

  <!-- Header Badge & Country Flag -->
  <g transform="translate(40, 40)">
    <rect width="260" height="40" rx="20" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="20" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">CHINA OPERATIONS HQ</text>
  </g>
  <g transform="translate(700, 40)">
    <circle cx="20" cy="20" r="20" fill="url(#gold)"/>
    <text x="20" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900">CN</text>
  </g>

  <!-- Bottom Info Overlay -->
  <g transform="translate(40, 470)" filter="url(#shadow)">
    <rect width="720" height="90" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="30" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Pintaback China HQ — Sourcing &amp; Operations</text>
    <text x="30" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Direct Sourcing Team Leader in China</text>
    <g transform="translate(450, 25)">
      <rect width="240" height="38" rx="19" fill="url(#gold)"/>
      <text x="120" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">✓ Direct Sourcing from China</text>
    </g>
  </g>
</svg>
