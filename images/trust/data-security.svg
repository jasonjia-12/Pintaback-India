<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ab7a"/>
      <stop offset="100%" stop-color="#c68a52"/>
    </linearGradient>
    <linearGradient id="skinChinese" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba518"/>
    </linearGradient>
    <linearGradient id="suitDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shirtWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="28" fill="url(#cardOverlay)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Character Scene -->
  
    <g transform="translate(250, 60)" filter="url(#shadow)">
      <!-- High Tech Shield Vault Backdrop -->
      <rect x="-80" y="20" width="460" height="360" rx="24" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-opacity="0.3" stroke-width="2"/>

      <!-- Character: Security Engineer Representative -->
      <path d="M 10 380 Q 150 250 290 380 Z" fill="#3730a3"/>
      <polygon points="130,270 170,270 150,380" fill="#ffffff"/>
      <path d="M 50 380 L 130 270 L 150 340 L 70 380 Z" fill="#312e81"/>
      <path d="M 250 380 L 170 270 L 150 340 L 230 380 Z" fill="#312e81"/>

      <!-- Neck & Head -->
      <rect x="130" y="220" width="40" height="60" rx="10" fill="url(#skinChinese)"/>
      <ellipse cx="150" cy="180" rx="52" ry="68" fill="url(#skinChinese)"/>

      <path d="M 98 150 C 98 85 202 85 202 150 C 180 100 120 100 98 150 Z" fill="#0f172a"/>
      <circle cx="132" cy="165" r="4.5" fill="#0f172a"/>
      <circle cx="168" cy="165" r="4.5" fill="#0f172a"/>
      <path d="M 136 195 Q 150 208 164 195" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>

      <!-- Floating Security Shield Key Badge -->
      <g transform="translate(180, 200)" filter="url(#glow)">
        <path d="M 50 0 Q 100 15 100 60 C 100 110 50 140 50 140 C 50 140 0 110 0 60 Q 0 15 50 0 Z" fill="url(#gold)"/>
        <circle cx="50" cy="50" r="16" fill="#ffffff"/>
        <rect x="44" y="60" width="12" height="30" fill="#ffffff"/>
      </g>
    </g>
  

  <!-- Header Badge & Country Flag -->
  <g transform="translate(40, 40)">
    <rect width="260" height="40" rx="20" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="20" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">DATA PRIVACY &amp; SECURITY</text>
  </g>
  <g transform="translate(700, 40)">
    <circle cx="20" cy="20" r="20" fill="url(#gold)"/>
    <text x="20" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900">SEC</text>
  </g>

  <!-- Bottom Info Overlay -->
  <g transform="translate(40, 470)" filter="url(#shadow)">
    <rect width="720" height="90" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="30" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Pintaback Security &amp; Data Retention Team</text>
    <text x="30" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Enterprise B2B Data Encryption &amp; Order Vault</text>
    <g transform="translate(480, 25)">
      <rect width="210" height="38" rx="19" fill="url(#gold)"/>
      <text x="105" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">✓ Encrypted Vault</text>
    </g>
  </g>
</svg>