<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ab7a"/>
      <stop offset="100%" stop-color="#c68a52"/>
    </linearGradient>
    <linearGradient id="skinChinese" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba518"/>
    </linearGradient>
    <linearGradient id="suitDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shirtWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="28" fill="url(#cardOverlay)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Character Scene -->
  
    <g transform="translate(250, 60)" filter="url(#shadow)">
      <!-- Office Backdrop Window -->
      <rect x="-80" y="20" width="460" height="360" rx="24" fill="#047857" fill-opacity="0.3" stroke="#a7f3d0" stroke-opacity="0.3" stroke-width="2"/>
      
      <!-- Character: Aarav Sharma (India Partner Representative) -->
      <!-- Shoulders & Suit -->
      <path d="M 10 380 Q 150 250 290 380 Z" fill="url(#suitDark)"/>
      <polygon points="120,280 180,280 150,380" fill="#ffffff"/> <!-- White Shirt -->
      <polygon points="145,280 155,280 152,360" fill="#047857"/> <!-- Green Tie -->
      <!-- Waistcoat/Jacket Lapels -->
      <path d="M 60 380 L 120 280 L 150 350 L 80 380 Z" fill="#065f46"/>
      <path d="M 240 380 L 180 280 L 150 350 L 220 380 Z" fill="#065f46"/>

      <!-- Neck & Head -->
      <rect x="130" y="220" width="40" height="60" rx="10" fill="url(#skinTone)"/>
      <ellipse cx="150" cy="180" rx="55" ry="70" fill="url(#skinTone)"/>

      <!-- Hair & Neat Beard (India Executive Style) -->
      <path d="M 95 160 C 95 90 205 90 205 160 C 190 110 110 110 95 160 Z" fill="#0f172a"/> <!-- Hair -->
      <path d="M 100 180 Q 150 260 200 180 Q 150 240 100 180 Z" fill="#0f172a" opacity="0.9"/> <!-- Well-groomed beard -->

      <!-- Eyes & Glasses -->
      <circle cx="130" cy="165" r="5" fill="#0f172a"/>
      <circle cx="170" cy="165" r="5" fill="#0f172a"/>
      <!-- Glasses Frame -->
      <rect x="115" y="152" width="30" height="24" rx="6" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <rect x="155" y="152" width="30" height="24" rx="6" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <line x1="145" y1="164" x2="155" y2="164" stroke="url(#gold)" stroke-width="3"/>

      <!-- Friendly Smile -->
      <path d="M 135 198 Q 150 212 165 198" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

      <!-- Holding Local B2B Contract Document -->
      <g transform="translate(190, 220)">
        <rect x="0" y="0" width="130" height="170" rx="12" fill="#ffffff" filter="url(#shadow)"/>
        <rect x="15" y="20" width="100" height="12" rx="4" fill="#047857"/>
        <rect x="15" y="45" width="80" height="6" rx="3" fill="#94a3b8"/>
        <rect x="15" y="60" width="90" height="6" rx="3" fill="#94a3b8"/>
        <rect x="15" y="75" width="70" height="6" rx="3" fill="#94a3b8"/>
        <circle cx="95" cy="125" r="18" fill="url(#gold)"/>
        <text x="95" y="130" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="900">IN</text>
      </g>
    </g>
  

  <!-- Header Badge & Country Flag -->
  <g transform="translate(40, 40)">
    <rect width="260" height="40" rx="20" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="20" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">LOCAL CHANNEL PARTNER</text>
  </g>
  <g transform="translate(700, 40)">
    <circle cx="20" cy="20" r="20" fill="url(#gold)"/>
    <text x="20" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="900">IN</text>
  </g>

  <!-- Bottom Info Overlay -->
  <g transform="translate(40, 470)" filter="url(#shadow)">
    <rect width="720" height="90" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="30" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Pintaback India Trading Co. — India Partner</text>
    <text x="30" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Local Channel Partner representative in Mumbai</text>
    <g transform="translate(480, 25)">
      <rect width="210" height="38" rx="19" fill="url(#gold)"/>
      <text x="105" y="24" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">✓ Local Contract &amp; INR</text>
    </g>
  </g>
</svg>