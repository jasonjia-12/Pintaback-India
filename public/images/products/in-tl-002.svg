            <rect x="100" y="160" width="320" height="36" rx="18" fill="url(#stainlessSteel)"/>
            <rect x="240" y="164" width="160" height="28" rx="14" fill="#0284c7"/>
            <!-- Wrench Head -->
            <circle cx="100" cy="178" r="45" fill="url(#stainlessSteel)"/>
            <!-- Adjustable Knurled Screw & Jaw -->
